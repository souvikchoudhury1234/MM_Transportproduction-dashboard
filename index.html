<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Production Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f8fafc; --panel:#ffffff; --ink:#0f172a; --muted:#64748b;
  --line:#e2e8f0; --line-soft:#f1f5f9;
  --primary:#1e3a8a; --primary-soft:#eef2ff;
  --accent:#2563eb;
  --alert:#dc2626; --alert-bg:#fef2f2; --alert-text:#991b1b;
  --good:#059669; --good-bg:#ecfdf5; --good-text:#065f46;
  --warn:#d97706; --warn-bg:#fffbeb;
  --qc:#7c3aed; --qc-bg:#f5f3ff;
  --leave:#a16207; --leave-bg:#fef9c3;
  --holiday:#1d4ed8; --holiday-bg:#dbeafe;
  --mm-main:#1e40af; --mm-main-bg:#eef2ff;
  --mm-roll:#0e7490; --mm-roll-bg:#ecfeff;
  --tr-main:#b45309; --tr-main-bg:#fffbeb;
  --roll:#6d28d9; --roll-bg:#f5f3ff;
  --hha:#0f766e; --hha-bg:#f0fdfa;
  --pa:#be185d; --pa-bg:#fdf2f8;
  --unassigned:#64748b; --unassigned-bg:#f1f5f9;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0f172a; --panel:#1e293b; --ink:#f1f5f9; --muted:#94a3b8;
    --line:#334155; --line-soft:#1e293b;
    --primary:#3b82f6; --primary-soft:#1e293b;
    --accent:#60a5fa;
    --alert:#ef4444; --alert-bg:#450a0a; --alert-text:#fca5a5;
    --good:#10b981; --good-bg:#064e3b; --good-text:#6ee7b7;
    --warn:#f59e0b; --warn-bg:#451a03;
    --qc:#a78bfa; --qc-bg:#2e1065;
    --leave:#eab308; --leave-bg:#422006;
    --holiday:#60a5fa; --holiday-bg:#172554;
    --mm-main-bg:#172554; --mm-roll-bg:#083344;
    --tr-main-bg:#451a03; --roll-bg:#2e1065;
    --hha-bg:#042f2e; --pa-bg:#500724;
    --unassigned-bg:#1e293b;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --panel:#1e293b; --ink:#f1f5f9; --muted:#94a3b8;
  --line:#334155; --line-soft:#1e293b;
  --primary:#3b82f6; --primary-soft:#1e293b;
  --accent:#60a5fa;
  --alert:#ef4444; --alert-bg:#450a0a; --alert-text:#fca5a5;
  --good:#10b981; --good-bg:#064e3b; --good-text:#6ee7b7;
  --warn:#f59e0b; --warn-bg:#451a03;
  --qc:#a78bfa; --qc-bg:#2e1065;
  --leave:#eab308; --leave-bg:#422006;
  --holiday:#60a5fa; --holiday-bg:#172554;
  --mm-main-bg:#172554; --mm-roll-bg:#083344;
  --tr-main-bg:#451a03; --roll-bg:#2e1065;
  --hha-bg:#042f2e; --pa-bg:#500724;
  --unassigned-bg:#1e293b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:14px;line-height:1.5}

.gate{position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.gate-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:36px 32px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 4px 20px rgba(15,23,42,0.06)}
.lock{font-size:40px;margin-bottom:12px;color:var(--primary)}
.gate h2{margin:0 0 6px;font-size:18px;font-weight:600;color:var(--ink)}
.gate p{margin:0 0 22px;color:var(--muted);font-size:13px}
.gate input{width:100%;padding:11px 14px;border:1px solid var(--line);
  border-radius:6px;font-size:14px;font-family:inherit;background:var(--panel);
  color:var(--ink);margin-bottom:10px;outline:none;transition:border 0.15s}
.gate input:focus{border-color:var(--accent)}
.gate button{width:100%;padding:11px;background:var(--primary);
  color:#fff;border:0;border-radius:6px;font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:background 0.1s}
.gate button:hover{background:var(--accent)}
.gate .err{color:var(--alert);font-size:12px;margin-top:10px;min-height:16px}
.gate .whitelist{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11px;color:var(--muted);text-align:left}
.gate .whitelist b{display:block;margin-bottom:6px;text-transform:uppercase;
  letter-spacing:0.05em;font-size:10px;color:var(--muted)}

.wrap{max-width:1400px;margin:0 auto;padding:24px}
.head{background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:20px 24px;margin-bottom:20px;
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;flex-wrap:wrap;border-top:3px solid var(--primary)}
.head h1{margin:0 0 4px;font-size:20px;font-weight:600;color:var(--ink)}
.head .sub{margin:0;color:var(--muted);font-size:13px}
.head .refresh-note{margin-top:4px;font-size:11px;color:var(--muted)}
.who{background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:6px 12px;font-size:12px;
  display:flex;align-items:center;gap:10px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.who a{color:var(--accent);text-decoration:none;font-size:11px;cursor:pointer}
.who a:hover{text-decoration:underline}

.data-note{background:var(--warn-bg);border:1px solid var(--line);
  border-left:3px solid var(--warn);border-radius:6px;
  padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--ink)}
.data-note b{color:var(--warn);font-weight:600}

.tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--line);
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:10px 18px;background:transparent;border:0;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);
  white-space:nowrap;transition:color 0.15s;border-bottom:2px solid transparent;
  margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab .dot{display:inline-block;margin-left:6px;background:var(--alert);color:#fff;
  font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;min-width:18px;
  text-align:center}
.tab.active .dot{background:var(--alert)}
.tab-trends{color:var(--muted)}
.tab-trends.active{color:var(--primary);border-bottom-color:var(--primary)}

.subfilter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.subfilter label{font-size:12px;font-weight:600;color:var(--muted)}
.subfilter select{padding:7px 12px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);border-radius:6px;
  font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;outline:none;
  min-width:200px}
.subfilter select:hover{border-color:var(--accent)}
.subfilter select:focus{border-color:var(--accent)}
.subfilter .count-note{font-size:12px;color:var(--muted)}
.subfilter .count-note b{color:var(--ink);font-weight:600}

tr.lead-header td{background:var(--primary-soft) !important;
  color:var(--primary) !important;font-weight:600;text-align:left !important;
  padding:8px 14px !important;font-size:11px;letter-spacing:0.05em;
  text-transform:uppercase;position:sticky;left:0;z-index:1;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tr.lead-header td .cnt{color:var(--muted);font-weight:400;margin-left:8px;font-size:11px;text-transform:none;letter-spacing:0}
tr.lead-header:hover td{background:var(--primary-soft) !important}

.footer-legend{background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:14px 16px;margin-top:16px;font-size:12px;
  color:var(--muted);line-height:1.8}
.footer-legend b{color:var(--ink);display:inline-block;min-width:120px;font-weight:600}
.footer-legend .glossary-title{font-size:11px;font-weight:600;
  letter-spacing:0.05em;text-transform:uppercase;color:var(--ink);
  display:block;margin-bottom:8px}

.attn-icon{display:inline-block;margin-right:5px;font-size:12px;
  vertical-align:middle;color:var(--alert)}
.emp-clickable{cursor:pointer;user-select:none;color:var(--ink)}
.emp-clickable:hover{color:var(--alert);text-decoration:underline}
.emp-clickable::after{content:" ›";color:var(--muted);font-size:11px}
.emp-clickable.open::after{content:" ⌄";color:var(--alert)}
tr.attn-details td{background:var(--alert-bg) !important;
  padding:12px 16px !important;border-bottom:1px solid var(--line);
  border-left:3px solid var(--alert)}
tr.attn-details .attn-title{font-weight:600;color:var(--alert-text);
  font-size:12px;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em}
tr.attn-details .attn-body{font-size:12.5px;color:var(--ink);line-height:1.7}
tr.attn-details .attn-body b{color:var(--alert-text);font-weight:600;font-variant-numeric:tabular-nums}

.compare-section{margin-top:24px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.compare-section h3{margin:0 0 12px;font-size:14px;font-weight:600;
  color:var(--ink);display:flex;align-items:center;gap:8px}
.compare-section .hint{font-size:11px;color:var(--muted);
  font-weight:400;margin-left:auto}
.compare-section .cmp-summary{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.compare-section .cmp-summary .box{padding:10px 14px;border-radius:6px;
  background:var(--bg);border:1px solid var(--line);flex:1;min-width:140px}
.compare-section .cmp-summary .box .k{font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-bottom:2px}
.compare-section .cmp-summary .box .v{font-size:18px;font-weight:600;color:var(--ink)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:14px 16px;border-top:3px solid var(--muted)}
.stat.c-cases{border-top-color:var(--primary)}
.stat.c-avg{border-top-color:var(--good)}
.stat.c-active{border-top-color:var(--accent)}
.stat.c-fails{border-top-color:var(--muted)}
.stat.alert{border-top-color:var(--alert);background:var(--alert-bg)}
.stat .lbl{font-size:11px;color:var(--muted);font-weight:600;
  letter-spacing:0.05em;text-transform:uppercase;margin-bottom:4px;
  display:flex;align-items:center;gap:6px}
.stat .icon{font-size:12px}
.stat.alert .lbl{color:var(--alert)}
.stat .val{font-size:22px;font-weight:600;color:var(--ink)}
.stat.alert .val{color:var(--alert-text)}

.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  margin-bottom:16px;font-size:12px;color:var(--muted)}
.legend .chip{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.legend .box{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

.tbl-wrap{background:var(--panel);border:1px solid var(--line);
  border-radius:6px;overflow:auto;max-height:75vh}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--line-soft);color:var(--muted);
  position:sticky;top:0;z-index:2;
  padding:10px 8px;text-align:center;font-weight:600;font-size:11px;
  letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap;
  border-bottom:1px solid var(--line)}
th.emp{text-align:left;left:0;z-index:3;min-width:240px}
th .wd{font-weight:400;font-size:10px;opacity:0.85;text-transform:none;letter-spacing:0}
th.rollup{position:sticky;right:0;z-index:2}
td{padding:8px;border-bottom:1px solid var(--line-soft);text-align:center;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
td.emp{text-align:left;font-weight:500;position:sticky;left:0;
  background:var(--panel);z-index:1;min-width:240px}
tbody tr:hover td{background:var(--line-soft)}
tbody tr:hover td.emp{background:var(--line-soft)}

.cat-pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;
  margin-left:6px;font-weight:600;letter-spacing:0.02em;
  vertical-align:middle;border:1px solid transparent}
.cat-mm-main{background:var(--mm-main-bg);color:var(--mm-main);border-color:var(--mm-main-bg)}
.cat-mm-roll{background:var(--mm-roll-bg);color:var(--mm-roll);border-color:var(--mm-roll-bg)}
.cat-tr-main{background:var(--tr-main-bg);color:var(--tr-main);border-color:var(--tr-main-bg)}
.cat-roll{background:var(--roll-bg);color:var(--roll);border-color:var(--roll-bg)}
.cat-hha{background:var(--hha-bg);color:var(--hha);border-color:var(--hha-bg)}
.cat-pa{background:var(--pa-bg);color:var(--pa);border-color:var(--pa-bg)}
.cat-unassigned{background:var(--unassigned-bg);color:var(--unassigned);border-color:var(--unassigned-bg)}

td.alert-cell{background:var(--alert-bg) !important;color:var(--alert-text);font-weight:600}
td.good-cell{background:var(--good-bg) !important;color:var(--good-text);font-weight:600}
td.qc-cell{background:var(--qc-bg) !important;color:var(--qc);font-size:11px;font-weight:600}
td.l-cell{background:var(--leave-bg) !important;color:var(--leave);font-size:11px;font-weight:600}
td.h-cell{background:var(--holiday-bg) !important;color:var(--holiday);font-size:11px;font-weight:600}
td.rollup{font-weight:600;background:var(--panel);position:sticky;right:0;z-index:1}
tbody tr:hover td.rollup{background:var(--line-soft)}
td.rollup.alert-cell{background:var(--alert-bg) !important;color:var(--alert-text)}
td.rollup.good-cell{background:var(--good-bg) !important;color:var(--good-text)}

.change-up{color:var(--good);font-weight:600}
.change-down{color:var(--alert);font-weight:600}
.change-flat{color:var(--muted);font-weight:500}
.arrow{display:inline-block;margin-right:3px;font-size:11px}

.empty{padding:40px;text-align:center;color:var(--muted);font-style:italic}
.loading{padding:60px;text-align:center;color:var(--muted)}
.hidden{display:none !important}

.cat-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;margin-bottom:16px}
.cat-card{background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:12px 14px;border-top:3px solid var(--muted)}
.cat-card.mm-main{border-top-color:var(--mm-main)}
.cat-card.mm-roll{border-top-color:var(--mm-roll)}
.cat-card.tr-main{border-top-color:var(--tr-main)}
.cat-card.roll{border-top-color:var(--roll)}
.cat-card.hha{border-top-color:var(--hha)}
.cat-card.pa{border-top-color:var(--pa)}
.cat-card .cname{font-size:11px;font-weight:600;letter-spacing:0.03em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cat-card .row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.cat-card .row span{color:var(--muted)}
.cat-card .row b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}

.chart-panel{background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:16px 18px;margin-bottom:14px}
.chart-panel h3{margin:0 0 10px;font-size:12px;font-weight:600;
  color:var(--muted);letter-spacing:0.05em;text-transform:uppercase}
.chart-wrap{position:relative;height:280px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}}
</style>
</head>

const CAT_LABEL = {"mm-main":"MM Main","mm-roll":"MM Rollover","tr-main":"Transport Main","roll":"Rollover","hha":"HHA","pa":"PA Team","unassigned":"Unassigned"};
const CAT_ORDER = ["mm-main","mm-roll","tr-main","roll","hha","pa","unassigned"];

function getTeamInfo(name){
  const k = String(name||"").toLowerCase().trim();
  if (TEAM_STRUCTURE[k]) return TEAM_STRUCTURE[k];
  // fuzzy: try first-word match if exactly one match
  const first = k.split(/[\s.@]/)[0];
  const matches = Object.entries(TEAM_STRUCTURE).filter(([key]) => key.split(/[\s.@]/)[0] === first);
  if (matches.length === 1) return matches[0][1];
  return {cat:"unassigned", lead:"-"};
}

const $ = id => document.getElementById(id);
const gate = $("gate"), app = $("app"), emailInp = $("emailInp"), gateErr = $("gateErr");

function tryAuth(email){
  const key = (email || "").trim().toLowerCase();
  if (VIEWERS[key]) {
    try { localStorage.setItem("prodDash_user", key); } catch(e){}
    showApp(key);
    return true;
  }
  return false;
}
function showApp(key){

  app.classList.remove("hidden");

}
$("signInBtn").addEventListener("click", () => {

});
emailInp.addEventListener("keydown", e => { if (e.key === "Enter") $("signInBtn").click(); });
$("signOut").addEventListener("click", () => {

let DATA = {}, MONTHS = [];
let STATE = {view:null, catFilter:"all"};
const ALERT_DAY = 8, ALERT_AVG = 10;
const ATTENTION_MONTHS_FROM = "September 2026";
const ATTENTION_AVG_THRESHOLD = 8;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function loadData(){
  try {
    const r = await fetch("data.json?ts=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    MONTHS = Object.keys(DATA);
    // enrich employees with category
    for (const m of MONTHS) {
      for (const e of DATA[m].employees) {
        const info = getTeamInfo(e.name);
        e.cat = info.cat;
        e.lead = info.lead;
        e.note = info.note || "";
      }
    }
    $("loading").classList.add("hidden");
    $("tabs").classList.remove("hidden");
    const def = MONTHS.find(m => DATA[m].employees.some(e => Object.values(e.days).some(x => x.s === "W"))) || MONTHS[0];
    if (def) render(def);
    let latest = null;
    for (const m of MONTHS) {
      for (const e of DATA[m].employees) {
        for (const [d, x] of Object.entries(e.days)) {
          if (x.s === "W") { const key = m + " " + d; if (!latest || key > latest) latest = key; }
        }
      }
    }
    if (latest) $("refreshNote").textContent = "Latest data: " + latest;
  } catch(e) {
    $("loading").innerHTML = `<div style="color:var(--alert)">Failed to load data.json — ${esc(e.message)}</div>`;
  }
}

function summarize(e){
  let sum=0, worked=0, leaves=0, qc=0, alertDays=0;
  Object.values(e.days).forEach(x => {
    if (x.s === "W") {
      sum += x.v||0; worked++;
      if ((x.v||0) < ALERT_DAY) alertDays++;
    } else if (x.s === "L") leaves++;
    else if (x.s === "QC") qc++;
  });
  const avg = worked ? sum/worked : 0;
  return {sum, worked, avg, leaves, qc, alertDays, avgAlert: worked>0 && avg<ALERT_AVG};
}
function countAlerts(m){
  let t=0; DATA[m].employees.forEach(e => { const s=summarize(e); t += s.alertDays + (s.avgAlert?1:0); }); return t;
}
function attentionRows(){
  const rows = [];
  const startIdx = MONTHS.indexOf(ATTENTION_MONTHS_FROM);
  if (startIdx < 0) return rows;
  for (let i = startIdx; i < MONTHS.length; i++){
    const m = MONTHS[i];
    DATA[m].employees.forEach(e => {
      const s = summarize(e);
      if (s.worked > 0 && s.avg < ATTENTION_AVG_THRESHOLD){
        rows.push({name: e.name, cat: e.cat, lead: e.lead, month: m,
          avg: s.avg, sum: s.sum, worked: s.worked, daysBelow8: s.alertDays});
      }
    });
  }
  rows.sort((a,b) => a.avg - b.avg);
  return rows;
}

function catPill(cat, note){
  const tip = note ? ` title="${esc(note)}"` : "";
  const asterisk = note ? "*" : "";
  return `<span class="cat-pill cat-${cat}"${tip}>${esc(CAT_LABEL[cat])}${asterisk}</span>`;
}

function renderTabs(active){
  const monthTabs = MONTHS.map(m => {
    const a = countAlerts(m);
    return `<button class="tab ${m===active?'active':''}" data-m="${esc(m)}">${esc(m.replace(" 2026",""))}${a?`<span class="dot">${a}</span>`:""}</button>`;
  }).join("");
  const trTab = `<button class="tab tab-trends ${active==='__trends'?'active':''}" data-m="__trends">Trends</button>`;
  $("tabs").innerHTML = monthTabs + trTab;
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => render(t.dataset.m)));
}

function renderSubfilter(emps, current){
  const counts = {all: emps.length};
  CAT_ORDER.forEach(c => counts[c] = emps.filter(e => e.cat === c).length);
  const opt = (id, label) => {
    const cnt = counts[id] || 0;
    return `<option value="${id}" ${current===id?'selected':''}>${label} (${cnt})</option>`;
  };
  const opts = [opt("all", "All Categories")];
  CAT_ORDER.forEach(c => { if (counts[c] > 0) opts.push(opt(c, CAT_LABEL[c])); });
  return `<div class="subfilter">
    <label for="catSel">Filter by:</label>
    <select id="catSel">${opts.join("")}</select>
    <span class="count-note">Showing <b>${counts[current]||0}</b> of ${counts.all} agents</span>
  </div>`;
}

function renderCatBand(emps){
  const groups = {};
  CAT_ORDER.forEach(c => groups[c] = []);
  emps.forEach(e => { if (groups[e.cat]) groups[e.cat].push(e); });
  const cards = CAT_ORDER.map(c => {
    const list = groups[c];
    if (!list.length) return "";
    let sum=0, worked=0, active=0;
    list.forEach(e => { const s = summarize(e); sum += s.sum; worked += s.worked; if (s.worked>0) active++; });
    const avg = worked ? sum/worked : 0;
    const cls = c.replace(/-/g,"-");
    return `<div class="cat-card ${cls}">
      <div class="cname">${esc(CAT_LABEL[c])} · ${list.length} agent${list.length!==1?'s':''}</div>
      <div class="row"><span>Total Cases</span><b>${sum.toLocaleString()}</b></div>
      <div class="row"><span>Team Avg</span><b>${avg.toFixed(2)}</b></div>
      <div class="row"><span>Active</span><b>${active}</b></div>
    </div>`;
  }).join("");
  return `<div class="cat-band">${cards}</div>`;
}

function render(month){
  STATE.view = month;
  if (month !== "__trends") destroyCharts();
  if (month === "__trends"){ renderTrends(); return; }
  STATE.catFilter = STATE.catFilter || "all";

  $("dataNote").classList.add("hidden");
  const md = DATA[month];
  const allEmps = md.employees;

  const teamAvg = totalWorked ? totalCases/totalWorked : 0;
  const active = emps.filter(e=>e.s.worked>0).length;

    <div class="stat c-cases"><div class="lbl">Total Cases</div><div class="val">${totalCases.toLocaleString()}</div></div>
    <div class="stat c-avg"><div class="lbl">Team Average</div><div class="val">${teamAvg.toFixed(2)}</div></div>
    <div class="stat c-active"><div class="lbl">Active Agents</div><div class="val">${active}</div></div>
    <div class="stat ${dayAlerts?'alert':'c-fails'}"><div class="lbl">Days Below 8</div><div class="val">${dayAlerts}</div></div>
    <div class="stat ${avgAlerts?'alert':'c-fails'}"><div class="lbl">Averages Below 10</div><div class="val">${avgAlerts}</div></div>
  `;
  const days = md.days;
  const head = `<tr>
    <th class="emp">Agent</th>
    ${days.map(d => `<th>${d.d}<br><span class="wd">${d.wd||""}</span></th>`).join("")}
    <th class="rollup">Total</th>
    <th class="rollup">Avg</th>
  </tr>`;
  // Sort within group: alert-first, then avg desc
  emps.sort((a,b) => {
    const aBad = a.s.avgAlert || a.s.alertDays>0 ? 1 : 0;
    const bBad = b.s.avgAlert || b.s.alertDays>0 ? 1 : 0;
    if (aBad !== bBad) return bBad - aBad;
    return b.s.avg - a.s.avg;
  });
  // Group by team lead
  const LEAD_ORDER = ["Jeswanth","Karthik","Sudeesh","-"];
  const LEAD_LABEL = {"Jeswanth":"Jeswanth's Team","Karthik":"Karthik's Team","Sudeesh":"Sudeesh's Team","-":"Others (HHA / PA / Unassigned)"};
  const groups = {};
  LEAD_ORDER.forEach(L => groups[L] = []);
  emps.forEach(e => { const L = groups[e.lead] !== undefined ? e.lead : "-"; groups[L].push(e); });

  const colspan = days.length + 3; // emp + days + total + avg
  const bodyParts = [];
  LEAD_ORDER.forEach(L => {
    const list = groups[L];
    if (!list.length) return;
    bodyParts.push(`<tr class="lead-header"><td colspan="${colspan}">${esc(LEAD_LABEL[L])}<span class="cnt">${list.length} agent${list.length!==1?'s':''}</span></td></tr>`);
    list.forEach(e => {
      const cells = days.map(d => {
        const c = e.days[d.d];
        if (!c) return `<td style="color:var(--muted)">·</td>`;
        if (c.s === "W") {
          const cls = c.v < ALERT_DAY ? "alert-cell" : (c.v >= 12 ? "good-cell" : "");
          return `<td class="${cls}">${c.v % 1 === 0 ? c.v : c.v.toFixed(1)}</td>`;
        }
        if (c.s === "QC") return `<td class="qc-cell">QC</td>`;
        if (c.s === "L")  return `<td class="l-cell">L</td>`;
        if (c.s === "H")  return `<td class="h-cell">H</td>`;
        return `<td style="color:var(--muted)">${esc(c.s)}</td>`;
      }).join("");
      const avgCls = e.s.worked === 0 ? "" : (e.s.avgAlert ? "alert-cell" : "good-cell");
      const avgTxt = e.s.worked ? e.s.avg.toFixed(2) : "—";
      // Attention flag: from September onward, avg < 8 (attention threshold)
      const startIdx = MONTHS.indexOf(ATTENTION_MONTHS_FROM);
      const currIdx = MONTHS.indexOf(month);
      const needsAttn = currIdx >= startIdx && e.s.worked > 0 && e.s.avg < ATTENTION_AVG_THRESHOLD;
      const attnIcon = needsAttn ? `<span class="attn-icon" title="Attention required">●</span>` : "";
      const nameClass = needsAttn ? "emp-clickable" : "";
      const empKey = `${month}::${e.name}`.replace(/[^a-zA-Z0-9]/g,"_");
      bodyParts.push(`<tr>
        <td class="emp">${attnIcon}<span class="${nameClass}" data-attn-key="${empKey}">${esc(e.name)}</span>${catPill(e.cat, e.note)}</td>
        ${cells}

      </tr>`);
      if (needsAttn) {
        const dropped = e.s.alertDays;
        const totalWorked = e.s.worked;
        const droppedPct = totalWorked > 0 ? (dropped/totalWorked*100).toFixed(0) : 0;

            <div class="attn-title">Attention required</div>
            <div class="attn-body">
              Monthly average: <b>${e.s.avg.toFixed(2)}</b> cases/day — below the attention threshold of <b>${ATTENTION_AVG_THRESHOLD}</b>.<br>
              Days below 8: <b>${dropped}</b> out of <b>${totalWorked}</b> worked days (<b>${droppedPct}%</b>).<br>
              Leave days: <b>${e.s.leaves}</b> · QC days: <b>${e.s.qc}</b> · Total cases: <b>${e.s.sum}</b>.<br>
              Team: <b>${esc(CAT_LABEL[e.cat])}</b>${e.lead!=='-'?` under <b>${esc(e.lead)}</b>`:""}.
            </div>
          </td>
        </tr>`);
      }
    });
  });
  const body = bodyParts.join("");
  $("content").innerHTML = `
    ${catBand}
    ${subfilter}
    <div class="summary">${kpis}</div>
    <div class="legend">
      <span class="chip"><span class="box" style="background:var(--alert-bg);border-color:var(--alert)"></span>Alert: daily &lt; 8 or avg &lt; 10</span>
      <span class="chip"><span class="box" style="background:var(--good-bg);border-color:var(--good)"></span>Good: day ≥ 12 or avg ≥ 10</span>
      <span class="chip" style="color:var(--qc)"><span class="box" style="background:var(--qc)"></span>QC</span>
      <span class="chip" style="color:var(--leave)"><span class="box" style="background:var(--leave)"></span>L = Leave</span>
      <span class="chip" style="color:var(--holiday)"><span class="box" style="background:var(--holiday)"></span>H = Holiday</span>
    </div>
    <div class="tbl-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    ${buildCompareSection(month, allEmps)}
    <div class="footer-legend">
      <span class="glossary-title">Abbreviations</span>
      <b>MM Main</b> — Major Medical Benefits Verification agent<br>
      <b>MM Rollover</b> — Major Medical rollover / overflow agent<br>
      <b>Transport Main</b> — Main Transportation Benefits Verification agent<br>
      <b>Rollover</b> — Shared rollover agent (covers both MM and Transportation)<br>
      <b>HHA</b> — Human Handoff Audit team<br>
      <b>PA Team</b> — Prior Authorization team<br>
      <b>L / H / QC</b> — Leave · Holiday · Quality Check<br>
      <b>● (red dot)</b> — Agent needs attention (monthly avg &lt; ${ATTENTION_AVG_THRESHOLD}). Click the name to see details.
    </div>
  `;
  // dropdown wiring
  const sel = document.getElementById("catSel");
  if (sel) sel.addEventListener("change", () => { STATE.catFilter = sel.value; render(month); });
  // clickable attention rows
  document.querySelectorAll(".emp-clickable").forEach(el => el.addEventListener("click", () => {
    const key = el.dataset.attnKey;
    const row = document.getElementById("attn_" + key);
    if (!row) return;
    const isOpen = !row.classList.contains("hidden");
    row.classList.toggle("hidden");
    el.classList.toggle("open", !isOpen);
  }));
}

function buildCompareSection(month, allEmps){
  const currIdx = MONTHS.indexOf(month);
  // find previous month WITH data
  let prevMonth = null;
  for (let i = currIdx - 1; i >= 0; i--){
    if (DATA[MONTHS[i]].employees.some(e => Object.values(e.days).some(x => x.s === "W"))){
      prevMonth = MONTHS[i]; break;
    }
  }
  if (!prevMonth) return "";
  // Build agent map for previous month
  const prevBy = new Map();
  DATA[prevMonth].employees.forEach(e => prevBy.set(e.name, summarize(e)));
  // Rows for each agent in current month
  const rows = allEmps.map(e => {
    const c = summarize(e);
    const p = prevBy.get(e.name);
    const pAvg = p ? p.avg : 0;
    const cAvg = c.avg;
    const change = pAvg > 0 ? ((cAvg - pAvg) / pAvg) * 100 : (cAvg > 0 ? 100 : 0);
    return {name:e.name, cat:e.cat, note:e.note,
      pSum: p ? p.sum : 0, pAvg,
      cSum: c.sum, cAvg,
      change, hasPrev: !!p && p.worked > 0, hasCurr: c.worked > 0};
  }).filter(r => r.hasPrev || r.hasCurr);
  rows.sort((a,b) => a.change - b.change); // worst first

  // Team totals
  const pTot = rows.reduce((a,r) => a + r.pSum, 0);
  const cTot = rows.reduce((a,r) => a + r.cSum, 0);
  const teamChange = pTot > 0 ? ((cTot - pTot) / pTot) * 100 : 0;
  const teamCls = teamChange > 0.5 ? "change-up" : teamChange < -0.5 ? "change-down" : "change-flat";
  const teamArrow = teamChange > 0.5 ? "▲" : teamChange < -0.5 ? "▼" : "▬";

  const head = `<tr>
    <th class="emp">Agent</th>
    <th>${esc(prevMonth.replace(" 2026",""))} Total</th>
    <th>${esc(prevMonth.replace(" 2026",""))} Avg</th>
    <th>${esc(month.replace(" 2026",""))} Total</th>
    <th>${esc(month.replace(" 2026",""))} Avg</th>
    <th class="rollup">Change</th>
  </tr>`;
  const body = rows.map(r => {
    let changeCell;
    if (!r.hasPrev && r.hasCurr){
      changeCell = `<td class="rollup change-up"><span class="arrow">▲</span>NEW</td>`;
    } else if (r.hasPrev && !r.hasCurr){
      changeCell = `<td class="rollup change-down"><span class="arrow">▼</span>GONE</td>`;
    } else {
      const arrow = r.change > 0.5 ? "▲" : r.change < -0.5 ? "▼" : "▬";
      const cls = r.change > 0.5 ? "change-up" : r.change < -0.5 ? "change-down" : "change-flat";
      changeCell = `<td class="rollup ${cls}"><span class="arrow">${arrow}</span>${Math.abs(r.change).toFixed(1)}%</td>`;
    }
    const pAvgCell = r.hasPrev ? r.pAvg.toFixed(2) : "—";
    const cAvgCell = r.hasCurr ? r.cAvg.toFixed(2) : "—";
    return `<tr>
      <td class="emp">${esc(r.name)}${catPill(r.cat, r.note)}</td>
      <td>${r.hasPrev ? r.pSum : "—"}</td>
      <td>${pAvgCell}</td>
      <td>${r.hasCurr ? r.cSum : "—"}</td>
      <td>${cAvgCell}</td>
      ${changeCell}
    </tr>`;
  }).join("");

  return `
    <div class="compare-section">
      <h3>Comparison: ${esc(prevMonth.replace(" 2026",""))} → ${esc(month.replace(" 2026",""))}
        <span class="hint">sorted by decline</span>
      </h3>
      <div class="cmp-summary">
        <div class="box"><div class="k">${esc(prevMonth.replace(" 2026",""))} Total</div><div class="v">${pTot.toLocaleString()}</div></div>
        <div class="box"><div class="k">${esc(month.replace(" 2026",""))} Total</div><div class="v">${cTot.toLocaleString()}</div></div>
        <div class="box"><div class="k">Team Change</div><div class="v ${teamCls}"><span class="arrow">${teamArrow}</span>${Math.abs(teamChange).toFixed(1)}%</div></div>
      </div>
      <div class="tbl-wrap" style="max-height:400px"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    </div>`;
}

function renderAttention(){
  renderTabs("__attention");

  const rows = attentionRows();

  </tr>`;
  const body = rows.map(r => `

    <div class="tbl-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
  `;

let CHARTS = {};
function destroyCharts(){ Object.values(CHARTS).forEach(c => { try { c.destroy(); } catch(e){} }); CHARTS = {}; }

function renderTrends(){
  renderTabs("__trends");
  $("dataNote").classList.add("hidden");
  destroyCharts();

  // Build monthly aggregates
  const monthsWithData = MONTHS.filter(m => DATA[m].employees.some(e => Object.values(e.days).some(x => x.s === "W")));
  if (!monthsWithData.length){
    $("content").innerHTML = `<div class="tbl-wrap"><div class="empty">No production data yet.</div></div>`;
    return;
  }
  const monthLabels = monthsWithData.map(m => m.replace(" 2026",""));

  // Totals & averages per month
  const totals = [], averages = [], activeCounts = [];
  const perCat = {}; // category -> array of totals per month
  CAT_ORDER.forEach(c => perCat[c] = new Array(monthsWithData.length).fill(0));
  monthsWithData.forEach((m, idx) => {
    let sum=0, worked=0, active=0;
    DATA[m].employees.forEach(e => {
      const s = summarize(e);
      sum += s.sum; worked += s.worked; if (s.worked>0) active++;
      if (perCat[e.cat]) perCat[e.cat][idx] += s.sum;
    });
    totals.push(sum);
    averages.push(worked ? sum/worked : 0);
    activeCounts.push(active);
  });

  // Month-over-month delta
  const growth = monthsWithData.map((m, i) => {
    if (i === 0) return null;
    const p = totals[i-1], c = totals[i];
    return p > 0 ? ((c - p) / p) * 100 : 0;
  });

  // Header KPIs: latest month vs previous
  const latestIdx = monthsWithData.length - 1;
  const latestTotal = totals[latestIdx];
  const latestAvg = averages[latestIdx];
  const latestGrowth = growth[latestIdx];
  const growthCls = latestGrowth == null ? "change-flat" : latestGrowth > 0.5 ? "change-up" : latestGrowth < -0.5 ? "change-down" : "change-flat";
  const growthArrow = latestGrowth == null ? "" : latestGrowth > 0.5 ? "▲" : latestGrowth < -0.5 ? "▼" : "▬";
  const growthText = latestGrowth == null ? "First month" : `${growthArrow} ${Math.abs(latestGrowth).toFixed(1)}%`;

  const kpis = `
    <div class="summary">
      <div class="stat c-cases"><div class="lbl">Latest Month</div><div class="val" style="font-size:16px">${esc(monthLabels[latestIdx])}</div></div>
      <div class="stat c-avg"><div class="lbl">Total Cases</div><div class="val">${latestTotal.toLocaleString()}</div></div>
      <div class="stat c-active"><div class="lbl">Team Average</div><div class="val">${latestAvg.toFixed(2)}</div></div>
      <div class="stat ${latestGrowth != null && latestGrowth < 0 ? 'alert' : 'c-active'}">
        <div class="lbl">vs Previous Month</div><div class="val ${growthCls}" style="font-size:18px">${growthText}</div>
      </div>
    </div>`;

  $("content").innerHTML = kpis + `
    <div class="chart-panel">
      <h3>Total Cases per Month</h3>
      <div class="chart-wrap"><canvas id="chartTotals"></canvas></div>
    </div>
    <div class="chart-grid">
      <div class="chart-panel">
        <h3>Team Daily Average per Month</h3>
        <div class="chart-wrap"><canvas id="chartAvg"></canvas></div>
      </div>
      <div class="chart-panel">
        <h3>Active Agents per Month</h3>
        <div class="chart-wrap"><canvas id="chartActive"></canvas></div>
      </div>
    </div>
    <div class="chart-grid">
      <div class="chart-panel">
        <h3>Category Share — ${esc(monthLabels[latestIdx])}</h3>
        <div class="chart-wrap"><canvas id="chartCategoryPie"></canvas></div>
      </div>
      <div class="chart-panel">
        <h3>Category Trend Over Months</h3>
        <div class="chart-wrap"><canvas id="chartCategoryLines"></canvas></div>
      </div>
    </div>
    <div class="data-note"><b>How to read:</b> Line charts show month-over-month change. Pie chart shows the share each team category contributed in the latest month. Multi-line chart tracks each category's total cases over time.</div>
  `;

  const ink = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
  const muted = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim();
  const line = getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
  const commonOpts = {
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{labels:{color:ink,font:{size:11,weight:"500"},padding:10,usePointStyle:true,pointStyle:"line"}},
      tooltip:{padding:10,backgroundColor:"rgba(15,23,42,0.9)",titleFont:{size:12},bodyFont:{size:12},cornerRadius:4}
    },
    scales:{
      x:{ticks:{color:muted,font:{size:11}},grid:{color:line,drawBorder:false}},
      y:{ticks:{color:muted,font:{size:11}},grid:{color:line,drawBorder:false},beginAtZero:true}
    }
  };
  const lineOpts = (color) => ({
    borderColor:color,
    backgroundColor:color.replace("rgb(","rgba(").replace(")",",0.08)"),
    tension:0.35,
    pointRadius:5,
    pointHoverRadius:7,
    pointBackgroundColor:color,
    pointBorderColor:"#fff",
    pointBorderWidth:2,
    fill:true,
    borderWidth:2.5
  });

  // Total cases — line
  CHARTS.totals = new Chart(document.getElementById("chartTotals"), {
    type:"line",
    data:{labels:monthLabels, datasets:[{
      label:"Total Cases", data:totals, ...lineOpts("rgb(30,58,138)")
    }]},
    options:commonOpts
  });

  // Team avg — line
  CHARTS.avg = new Chart(document.getElementById("chartAvg"), {
    type:"line",
    data:{labels:monthLabels, datasets:[{
      label:"Team Daily Average", data:averages.map(v => +v.toFixed(2)),
      ...lineOpts("rgb(5,150,105)")
    }]},
    options:commonOpts
  });

  // Active agents — line
  CHARTS.active = new Chart(document.getElementById("chartActive"), {
    type:"line",
    data:{labels:monthLabels, datasets:[{
      label:"Active Agents", data:activeCounts, ...lineOpts("rgb(100,116,139)")
    }]},
    options:commonOpts
  });

  // Category pie (latest month)
  const catColors = {
    "mm-main":"#1e40af","mm-roll":"#0e7490","tr-main":"#b45309",
    "roll":"#6d28d9","hha":"#0f766e","pa":"#be185d","unassigned":"#64748b"
  };
  const pieLabels = [], pieData = [], pieBg = [];
  CAT_ORDER.forEach(c => {
    const v = perCat[c][latestIdx];
    if (v > 0) { pieLabels.push(CAT_LABEL[c]); pieData.push(v); pieBg.push(catColors[c]); }
  });
  CHARTS.catPie = new Chart(document.getElementById("chartCategoryPie"), {
    type:"doughnut",
    data:{labels:pieLabels, datasets:[{
      data:pieData, backgroundColor:pieBg, borderColor:"#fff", borderWidth:2
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      cutout:"55%",
      plugins:{
        legend:{position:"right",labels:{color:ink,font:{size:12,weight:"500"},padding:10,usePointStyle:true,pointStyle:"circle"}},
        tooltip:{padding:10,backgroundColor:"rgba(15,23,42,0.9)",callbacks:{
          label: ctx => {
            const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
            const pct = total > 0 ? (ctx.parsed/total*100).toFixed(1) : 0;
            return `${ctx.label}: ${ctx.parsed.toLocaleString()} (${pct}%)`;
          }
        }}
      }
    }
  });

  // Category trend — multi-line
  const catDatasets = CAT_ORDER
    .filter(c => perCat[c].some(v => v > 0))
    .map(c => ({
      label: CAT_LABEL[c],
      data: perCat[c],
      borderColor: catColors[c],
      backgroundColor: "transparent",
      tension:0.35,
      pointRadius:4,
      pointHoverRadius:6,
      pointBackgroundColor: catColors[c],
      pointBorderColor:"#fff",
      pointBorderWidth:2,
      borderWidth:2,
      fill:false
    }));
  CHARTS.catLines = new Chart(document.getElementById("chartCategoryLines"), {
    type:"line",
    data:{labels:monthLabels, datasets:catDatasets},
    options:commonOpts
  });
}

function renderCompare(){
  renderTabs("__compare");
  $("dataNote").classList.add("hidden");
  // Build per-agent per-month totals & avg
  const monthsWithData = MONTHS.filter(m => DATA[m].employees.some(e => Object.values(e.days).some(x => x.s === "W")));
  if (monthsWithData.length < 2){
    $("content").innerHTML = `<div class="tbl-wrap"><div class="empty">Need at least two months of data to compare. Currently have: ${esc(monthsWithData.join(", "))||"none"}.</div></div>`;
    return;
  }
  // Aggregate per agent
  const agentMap = new Map(); // name -> {cat, lead, months:{month:{sum,avg}}}
  for (const m of monthsWithData){
    for (const e of DATA[m].employees){
      if (!agentMap.has(e.name)) agentMap.set(e.name, {name:e.name, cat:e.cat, lead:e.lead, note:e.note, months:{}});
      const s = summarize(e);
      agentMap.get(e.name).months[m] = {sum:s.sum, avg:s.avg, worked:s.worked};
    }
  }
  const agents = Array.from(agentMap.values());
  // Latest two months for the primary comparison
  const [prev, curr] = monthsWithData.slice(-2);
  // Sort by change % desc (biggest improvers first would push best up; put worst first for attention)
  agents.forEach(a => {
    const p = a.months[prev]?.avg || 0;
    const c = a.months[curr]?.avg || 0;
    a.change = p > 0 ? ((c - p) / p) * 100 : (c > 0 ? 100 : 0);
    a.diff = c - p;
  });
  agents.sort((a,b) => a.change - b.change); // worst first

  // Team-level summary
  const teamPrev = agents.reduce((sum,a) => sum + (a.months[prev]?.sum||0), 0);
  const teamCurr = agents.reduce((sum,a) => sum + (a.months[curr]?.sum||0), 0);
  const teamChange = teamPrev > 0 ? ((teamCurr - teamPrev) / teamPrev) * 100 : 0;
  const teamArrow = teamChange > 0.5 ? `<span class="arrow change-up">▲</span>` : teamChange < -0.5 ? `<span class="arrow change-down">▼</span>` : `<span class="arrow change-flat">▬</span>`;
  const teamCls = teamChange > 0.5 ? "change-up" : teamChange < -0.5 ? "change-down" : "change-flat";

  const kpis = `
    <div class="summary">
      <div class="stat c-cases"><div class="lbl">📅 Comparing</div><div class="val" style="font-size:14px">${esc(prev.replace(" 2026",""))} → ${esc(curr.replace(" 2026",""))}</div></div>
      <div class="stat c-avg"><div class="lbl">📋 ${esc(prev.replace(" 2026",""))} Total</div><div class="val">${teamPrev.toLocaleString()}</div></div>
      <div class="stat c-avg"><div class="lbl">📋 ${esc(curr.replace(" 2026",""))} Total</div><div class="val">${teamCurr.toLocaleString()}</div></div>
      <div class="stat ${teamChange<0?'alert':'c-active'}"><div class="lbl">📈 Team Change</div><div class="val ${teamCls}">${teamArrow}${Math.abs(teamChange).toFixed(1)}%</div></div>
    </div>`;

  // Table columns: Agent | (each month sum) | (each month avg) | Change %
  const monthCols = monthsWithData.map(m =>
    `<th>${esc(m.replace(" 2026",""))}<br><span class="wd">Total</span></th>
     <th>${esc(m.replace(" 2026",""))}<br><span class="wd">Avg</span></th>`
  ).join("");
  const head = `<tr>
    <th class="emp">Agent</th>
    ${monthCols}
    <th class="rollup">Change<br><span class="wd">${esc(prev.replace(" 2026",""))} → ${esc(curr.replace(" 2026",""))}</span></th>
  </tr>`;

  const body = agents.map(a => {
    const monthCells = monthsWithData.map(m => {
      const rec = a.months[m];
      if (!rec || rec.worked === 0) return `<td style="color:var(--muted)">—</td><td style="color:var(--muted)">—</td>`;
      const avgCls = rec.avg < ALERT_AVG ? "alert-cell" : (rec.avg >= ALERT_AVG ? "good-cell" : "");
      return `<td>${rec.sum}</td><td class="${avgCls}">${rec.avg.toFixed(2)}</td>`;
    }).join("");
    const p = a.months[prev]?.avg || 0;
    const c = a.months[curr]?.avg || 0;
    let changeCell;
    if (p === 0 && c === 0){
      changeCell = `<td class="rollup change-flat">—</td>`;
    } else if (p === 0){
      changeCell = `<td class="rollup change-up"><span class="arrow">▲</span>NEW</td>`;
    } else if (c === 0){
      changeCell = `<td class="rollup change-down"><span class="arrow">▼</span>GONE</td>`;
    } else {
      const arrow = a.change > 0.5 ? `<span class="arrow">▲</span>` : a.change < -0.5 ? `<span class="arrow">▼</span>` : `<span class="arrow">▬</span>`;
      const cls = a.change > 0.5 ? "change-up" : a.change < -0.5 ? "change-down" : "change-flat";
      changeCell = `<td class="rollup ${cls}">${arrow}${Math.abs(a.change).toFixed(1)}%</td>`;
    }
    return `<tr>
      <td class="emp">${esc(a.name)}${catPill(a.cat, a.note)}${a.lead!=='-'?`<span class="lead-tag">${esc(a.lead)}</span>`:""}</td>
      ${monthCells}
      ${changeCell}
    </tr>`;
  }).join("");

  $("content").innerHTML = `
    ${kpis}
    <div class="data-note"><b>Comparison:</b> ${esc(prev)} vs ${esc(curr)} monthly averages. <span class="change-up">▲ Green</span> = improved · <span class="change-down">▼ Red</span> = declined · sorted worst-decline first.</div>
    <div class="tbl-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
  `;
}
</script>
